<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div>
      <h1>Smart Student Dashboard</h1>
      <p id="greeting"></p>
    </div>

    <div class="header-actions">
      <button onclick="toggleTheme()">Theme</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- SEARCH + SORT -->
  <div class="controls">
    <input type="text" id="search" placeholder="Search tasks">

    <select id="sort">
      <option value="new">Newest</option>
      <option value="priority">Priority</option>
    </select>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button id="myTasksBtn">My Tasks</button>
    <button id="teamTasksBtn">Team Tasks</button>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div>Total: <span id="total">0</span></div>
    <div>Completed: <span id="completed">0</span></div>
    <div>Pending: <span id="pending">0</span></div>
  </div>

  <!-- PROGRESS BAR -->
  <div class="progress-container">
    <div id="progressBar"></div>
  </div>

  <!-- CHART -->
  <canvas id="taskChart"></canvas>

  <!-- INSIGHT -->
  <p id="insight"></p>

  <!-- ADD TASK -->
  <div class="task-form">
    <input type="text" id="title" placeholder="Task Title">
    <input type="text" id="description" placeholder="Description">
    <input type="date" id="deadline">
    <input type="text" id="assignedTo" placeholder="Assign to (email)">
    <button id="addBtn">Add Task</button>
  </div>

 <!-- KANBAN BOARD -->
<div class="kanban">

  <div class="column">
    <h3>To Do</h3>
    <div id="todo" class="dropzone"></div>
  </div>

  <div class="column">
    <h3>In Progress</h3>
    <div id="inProgress" class="dropzone"></div>
  </div>

  <div class="column">
    <h3>Done</h3>
    <div id="done" class="dropzone"></div>
  </div>

</div>


</div>

<!-- TOAST NOTIFICATION -->
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
